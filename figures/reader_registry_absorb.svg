<svg xmlns="http://www.w3.org/2000/svg" width="1994" height="1280" viewBox="0 0 1994 1280" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1994" height="1280" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">形の癖は核ではなく、読み取り係の宣言と人の判断に溜まる — どの層が吸収するか</text>
<text x="36" y="74" font-size="14" fill="#5b6272">出典 = 私の記録(非公開)に残っていた該当箇所と、その場で実走した選定と読み替えの件数。癖の収集は私の記録の範囲に限る(網羅ではない)。核の列に癖の名前が 1 つも無いことは、核のソースに原本の見出し・核の列名・業種の語が出てこないことをテストで確かめている</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">核(計算と検査)で吸収する</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">読み取り係の宣言で吸収する</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">人が宣言を書くしかない</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">どの層でも吸収できない(この 2 層の外)</text>
<text x="172" y="207.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">行と列が入れ替わった表</text>
<rect x="190" y="132" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="195" r="2.5" fill="#5b6272"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核は向きを知らない</text>
<circle cx="216" cy="219" r="2.5" fill="#5b6272"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核の列は 7 つのまま</text>
<rect x="636" y="132" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収する</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">orientation の 1 語だけ</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 候補 1 件 → 3 行読めた</text>
<rect x="1082" y="132" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">向きを 1 語</text>
<circle cx="1108" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どちらの向きかは人が見て決める</text>
<rect x="1528" y="132" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">残りは無い</text>
<circle cx="1554" cy="195" r="2.5" fill="#5b6272"/>
<text x="1566" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録: 転置の読み取りが 1 本</text>
<text x="172" y="363.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">時間が 60 進の表記</text>
<rect x="190" y="288" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="324" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="351" r="2.5" fill="#5b6272"/>
<text x="228" y="356" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核は時間の表記を知らない</text>
<rect x="636" y="288" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="324" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収する</text>
<circle cx="662" cy="351" r="2.5" fill="#3b5bdb"/>
<text x="674" y="356" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">値の形『60進の時間』</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 12 件を 10 進に</text>
<rect x="1082" y="288" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="324" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">形の名前を選ぶ</text>
<circle cx="1108" cy="351" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="356" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どの列が時間かは人が決める</text>
<rect x="1528" y="288" width="430" height="140" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="324" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">丸めた差が残る</text>
<circle cx="1554" cy="351" r="2.5" fill="#c2410c"/>
<text x="1566" y="356" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">分が割り切れない時は 2 桁に丸める</text>
<circle cx="1554" cy="375" r="2.5" fill="#c2410c"/>
<text x="1566" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 12 件のうち 4 件、差は 1/300 時間</text>
<text x="172" y="519.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">符号なしで印字される</text>
<rect x="190" y="444" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="480" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="507" r="2.5" fill="#5b6272"/>
<text x="228" y="512" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核は符号の置き方を知らない</text>
<rect x="636" y="444" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="480" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収する</text>
<circle cx="662" cy="507" r="2.5" fill="#3b5bdb"/>
<text x="674" y="512" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">『印字は符号なし』と『括弧は負』</text>
<circle cx="662" cy="531" r="2.5" fill="#3b5bdb"/>
<text x="674" y="536" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 9 件と 3 件が同じ形に</text>
<rect x="1082" y="444" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="480" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">引く側かを決める</text>
<circle cx="1108" cy="507" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="512" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どの列が引く側かは人が宣言する</text>
<rect x="1528" y="444" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="480" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">残りは無い</text>
<circle cx="1554" cy="507" r="2.5" fill="#5b6272"/>
<text x="1566" y="512" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録: 取込側の制約で 36 本が踏んでいた</text>
<text x="172" y="675.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">項目名が年で改名される</text>
<rect x="190" y="600" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="636" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="663" r="2.5" fill="#5b6272"/>
<text x="228" y="668" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核の列名は変えない</text>
<rect x="636" y="600" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="636" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">係を 1 つ足す</text>
<circle cx="662" cy="663" r="2.5" fill="#3b5bdb"/>
<text x="674" y="668" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">原本の見出しが 2 件だけ違う係</text>
<circle cx="662" cy="687" r="2.5" fill="#3b5bdb"/>
<text x="674" y="692" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 候補 1 件 → 3 行読めた</text>
<rect x="1082" y="600" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="636" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">同じ列か決める</text>
<circle cx="1108" cy="663" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="668" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">改名前と後を同じ核の列に移すかは人の判断</text>
<rect x="1528" y="600" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="636" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">残りは無い</text>
<circle cx="1554" cy="663" r="2.5" fill="#5b6272"/>
<text x="1566" y="668" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録: 項目の改名の分類が 1 本</text>
<text x="172" y="831.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">項目が増減する</text>
<rect x="190" y="756" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="792" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="819" r="2.5" fill="#5b6272"/>
<text x="228" y="824" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核の列は増やさない</text>
<rect x="636" y="756" width="430" height="140" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="792" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">気づくところまで</text>
<circle cx="662" cy="819" r="2.5" fill="#c2410c"/>
<text x="674" y="824" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">宣言表に無い見出しは台帳に残す</text>
<circle cx="662" cy="843" r="2.5" fill="#c2410c"/>
<text x="674" y="848" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 列が 2 つ増えた表は候補 0 件</text>
<rect x="1082" y="756" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="792" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">宣言を書き直す</text>
<circle cx="1108" cy="819" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="824" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">軸の長さと列の対応を人が直す</text>
<rect x="1528" y="756" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="792" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">残りは無い</text>
<circle cx="1554" cy="819" r="2.5" fill="#5b6272"/>
<text x="1566" y="824" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録: 項目の増減の分類が 1 本</text>
<text x="172" y="987.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">文字コードが混在する</text>
<rect x="190" y="912" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="948" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="975" r="2.5" fill="#5b6272"/>
<text x="228" y="980" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核は文字を受け取らない</text>
<rect x="636" y="912" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="948" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="662" cy="975" r="2.5" fill="#5b6272"/>
<text x="674" y="980" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">この部品はテキストを受け取る</text>
<rect x="1082" y="912" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="948" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">ここでは無い</text>
<circle cx="1108" cy="975" r="2.5" fill="#5b6272"/>
<text x="1120" y="980" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">宣言表に文字コードの列は無い</text>
<rect x="1528" y="912" width="430" height="140" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="948" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">前の層の仕事</text>
<circle cx="1554" cy="975" r="2.5" fill="#c2410c"/>
<text x="1566" y="980" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">文字コードを決める部品が受ける</text>
<circle cx="1554" cy="999" r="2.5" fill="#c2410c"/>
<text x="1566" y="1004" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録: 26 本が踏み、17 か所に別実装</text>
<text x="172" y="1143.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">見出しが複数行</text>
<rect x="190" y="1068" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="1104" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">吸収しない</text>
<circle cx="216" cy="1131" r="2.5" fill="#5b6272"/>
<text x="228" y="1136" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">核は見出しを見ない</text>
<rect x="636" y="1068" width="430" height="140" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="1104" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">説明行なら吸収する</text>
<circle cx="662" cy="1131" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1136" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">見出しの軸を探すので前に行があっても良い</text>
<circle cx="662" cy="1155" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1160" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 説明行 2 行 → 3 行読めた</text>
<rect x="1082" y="1068" width="430" height="140" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="1104" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">ここでは無い</text>
<circle cx="1108" cy="1131" r="2.5" fill="#5b6272"/>
<text x="1120" y="1136" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">2 段は宣言では書けない</text>
<rect x="1528" y="1068" width="430" height="140" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="1104" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">2 段は読めない</text>
<circle cx="1554" cy="1131" r="2.5" fill="#c2410c"/>
<text x="1566" y="1136" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1 行に全部そろうことが前提</text>
<circle cx="1554" cy="1155" r="2.5" fill="#c2410c"/>
<text x="1566" y="1160" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実走: 候補 1 件 → 見出し行が見つからない</text>
<rect x="190" y="1234" width="18" height="14" rx="4" fill="#e7ecfb" stroke="#c4d0f6"/>
<text x="216" y="1246" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">宣言と実走で吸収できた</text>
<rect x="398" y="1234" width="18" height="14" rx="4" fill="#fff1e8" stroke="#f5c9ae"/>
<text x="424" y="1246" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">吸収しきれない残り</text>
<rect x="578" y="1234" width="18" height="14" rx="4" fill="#eef0f5" stroke="#d9dce6"/>
<text x="604" y="1246" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">その層の仕事ではない</text>
</svg>