<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">行が動いてきた月日(左)と、行に付いた予定(右)— 数表のまとまりごと 45 rule</text>
<text x="36" y="74" font-size="14" fill="#5b6272">予定は台帳から行へ写された日付で、行ごとに調べた値ではない。比べ方(どれかの行 / 最後の行)で件数は動く。食い違いを誤りとは言わない。期限の判定は実行日に依るので使っていない。手元の 1 回の生成物だけで網羅ではない。</text>
