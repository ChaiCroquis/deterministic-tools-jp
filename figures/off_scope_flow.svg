<text x="2600" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">4 値 5 欄 + 別枠 7 = 項目の件数</text>
<circle cx="2588" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">宣言ごと / 在り所ごとにも数える</text>
<circle cx="2588" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(B) の行数と由来、2 通りの分母</text>
<circle cx="2588" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">判定部分 → sha256</text>
