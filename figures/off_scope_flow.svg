<circle cx="1956" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">在り所が 無い か行が無いか</text>
<circle cx="1956" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">両方無ければ別枠へ</text>
<line x1="2200" y1="204.0" x2="2240" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
