<text x="1336" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">別の記号が 2 行なら別枠へ</text>
<circle cx="1324" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どちらが本当かを決めない</text>
<circle cx="1324" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行数は数える在り所だけ</text>
