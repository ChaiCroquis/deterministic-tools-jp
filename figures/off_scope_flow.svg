<rect width="2860" height="426" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">対象外と書いた項目 1 件に 4 値を付けるまでの流れ</text>
<text x="36" y="74" font-size="14" fill="#5b6272">橙のピルが関所。線を引き直す経路・収録すべきかを決める経路・必須かどうかを判断する経路・項目名から領域を推測する経路・条文や規約を読む経路・取りに行く経路・走らせる経路・割合を単独で出す経路・0 件と欄が無いを同じ値にする経路・現在時刻を読む経路・入力を書き換える経路は、この図に無い(引数が無い)。</text>
<rect x="36" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="36" y="118" width="260" height="6" rx="3" fill="#e7ecfb"/>
<circle cx="62" cy="152" r="14" fill="#3b5bdb"/>
