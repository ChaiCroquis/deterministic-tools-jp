<circle cx="2272" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">第2層 / case属性 → (C)</text>
<circle cx="2272" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">境界 + 入る形 → (D)、ほかは (A)</text>
<line x1="2516" y1="204.0" x2="2556" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="2564" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
