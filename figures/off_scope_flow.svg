<text x="72" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">領域の登録表は 3 列</text>
<circle cx="60" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="72" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">在り所の台帳は 5 列</text>
<circle cx="60" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="72" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">入る形と登録表 2 枚</text>
<line x1="304" y1="204.0" x2="344" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
