<rect x="1512.25" y="310" width="151.5" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1588.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">行き先が 2 つ以上</text>
<line x1="1904.0" y1="292" x2="1904.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1822.075" y="310" width="163.85" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1904.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">入る形の 3 つの別枠</text>
<line x1="2536.0" y1="292" x2="2536.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="2429.375" y="310" width="213.25" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="2536.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">合計が合わない(verify)</text>
<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">6 枚のどれかの登録が壊れていたら、どの項目も数えない(4 値は全て 0 で、理由コード 7 個のうち該当するものが返る)。(D) の 1 つめに進むのは 境界として明示 の項目だけで、外 と言い切った項目に入る形が書かれていても列に出るだけになる。宣言と道具の経路の突合は scope_ledger、表の外を誰が埋めるかは fill_owner、日付の種別の台帳は basis_map、効き始める日が来ていない行は future_row、参照されない行は idle_rows の仕事。</text>
