<text x="1348" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">行き先の数を見る</text>
<circle cx="1324" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">在り所の行が 0 行か 1 種か</text>
