<text x="640.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">出典が空 / id の重複</text>
<line x1="956.0" y1="292" x2="956.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="855.55" y="310" width="200.9" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="956.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">登録の不備 / 基準日が無い</text>
<line x1="1272.0" y1="292" x2="1272.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1202.425" y="310" width="139.14999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1272.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">記号が登録表に無い</text>
