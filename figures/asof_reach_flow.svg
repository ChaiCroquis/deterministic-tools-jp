<svg xmlns="http://www.w3.org/2000/svg" width="2860" height="426" viewBox="0 0 2860 426" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="2860" height="426" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">公表時点の欄が付いた行 1 件に 4 値を付け、問い 1 件に 3 値を付けるまでの流れ</text>
<text x="36" y="74" font-size="14" fill="#5b6272">橙のピルが関所。公表日を暦や版の名前から推定する経路・外へ取りに行く経路・仮置きを実値へ格上げする経路・正しい側を決める経路・再現できる率を単独で出す経路・理由を言い当てる経路・宣言の文を採点する経路・時計を読む経路・入力を書き換える経路は、この図に無い(引数が無い)。</text>
<rect x="36" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="36" y="118" width="260" height="6" rx="3" fill="#e7ecfb"/>
<circle cx="62" cy="152" r="14" fill="#3b5bdb"/>
<text x="62" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="84" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">4 枚を読む</text>
<circle cx="60" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="72" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行の台帳は 10 列</text>
<circle cx="60" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="72" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">品質の記号の登録表は 4 列</text>
<circle cx="60" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="72" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">問いの台帳は 5 列</text>
<circle cx="60" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="72" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">宣言の台帳は 4 列</text>
<line x1="304" y1="204.0" x2="344" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="352" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="352" y="118" width="260" height="6" rx="3" fill="#d6def9"/>
<circle cx="378" cy="152" r="14" fill="#3b5bdb"/>
<text x="378" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="400" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">台帳の側を見る</text>
<circle cx="376" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="388" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典の欄が埋まっているか</text>
<circle cx="376" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="388" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行 id が重複しないか</text>
<circle cx="376" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="388" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">期間の端が逆でないか</text>
<circle cx="376" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="388" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">問い id / 宣言 id が 1 行か</text>
<line x1="620" y1="204.0" x2="660" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="668" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="668" y="118" width="260" height="6" rx="3" fill="#c4d0f6"/>
<circle cx="694" cy="152" r="14" fill="#3b5bdb"/>
<text x="694" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="716" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">登録と日付を見る</text>
<circle cx="692" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="704" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">登録の行に出典が在るか</text>
<circle cx="692" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="704" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">意味が決めた 5 つの中か</text>
<circle cx="692" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="704" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">要求する欄が決めた 3 つの中か</text>
<circle cx="692" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="704" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">日付が ISO か、as_of が在るか</text>
<line x1="936" y1="204.0" x2="976" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="984" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="984" y="118" width="260" height="6" rx="3" fill="#b0c1f2"/>
<circle cx="1010" cy="152" r="14" fill="#3b5bdb"/>
<text x="1010" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="1032" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">品質の記号を登録表に当てる</text>
<circle cx="1008" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">登録表に在る記号か</text>
<circle cx="1008" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">無ければ別枠へ(推測しない)</text>
<circle cx="1008" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実値 / 仮置き 3 種 / 不明 を読む</text>
<circle cx="1008" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">値の名前は判定に入らない</text>
<line x1="1252" y1="204.0" x2="1292" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1300" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1300" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1326" cy="152" r="14" fill="#3b5bdb"/>
<text x="1326" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="1348" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">記号が要求する欄を見る</text>
<circle cx="1324" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">仮置きは理由の文字列を要求</text>
<circle cx="1324" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実値は別出典の公表日を要求</text>
<circle cx="1324" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">空なら別枠へ(枠は 2 つに分かれる)</text>
<circle cx="1324" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由の文字は読まない</text>
<line x1="1568" y1="204.0" x2="1608" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1616" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1616" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1642" cy="152" r="14" fill="#3b5bdb"/>
<text x="1642" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="1664" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">境界日 2 つを並べる</text>
<circle cx="1640" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">known_from と valid_from</text>
<circle cx="1640" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ日か / 前か / 後か</text>
<circle cx="1640" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">後なら遡及の形</text>
<circle cx="1640" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">日数は整数の日差(float を使わない)</text>
<line x1="1884" y1="204.0" x2="1924" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1932" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1932" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1958" cy="152" r="14" fill="#3b5bdb"/>
<text x="1958" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="1980" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">4 値へ振り分ける</text>
<circle cx="1956" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">経路が無い → (D)</text>
<circle cx="1956" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ日 → (B) + 見分け不能 の印</text>
<circle cx="1956" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実値 + 別の日 → (A)</text>
<circle cx="1956" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">残りは (C) 仮置きのまま動く日付</text>
<line x1="2200" y1="204.0" x2="2240" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="2248" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="2248" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="2274" cy="152" r="14" fill="#3b5bdb"/>
<text x="2274" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
<text x="2296" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">問いに 3 値を付ける</text>
<circle cx="2272" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">as_of と基準日は問いの台帳から</text>
<circle cx="2272" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">知識時間の中か / 有効時間の中か</text>
<circle cx="2272" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">答えが乗っているものを必ず付ける</text>
<circle cx="2272" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">台帳に無い行 id は別枠(分母は問い)</text>
<line x1="2516" y1="204.0" x2="2556" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="2564" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="2564" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="2590" cy="152" r="14" fill="#3b5bdb"/>
<text x="2590" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text>
<text x="2612" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">件数と差を並べる</text>
<circle cx="2588" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">4 値 + 行に付く別枠 6 = 行の件数</text>
<circle cx="2588" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">品質の意味ごとにも数える</text>
<circle cx="2588" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">2 通りの数え方と差の検算</text>
<circle cx="2588" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="2600" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">判定部分 → sha256</text>
<line x1="324.0" y1="292" x2="324.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="180.32500000000002" y="310" width="287.34999999999997" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="324.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">列・行・id が決めた外(終了コード 2)</text>
<line x1="640.0" y1="292" x2="640.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="490.15" y="310" width="299.7" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="640.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">出典が空 / id の重複 / 期間の端が逆</text>
<line x1="956.0" y1="292" x2="956.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="756.75" y="310" width="398.5" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="956.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">登録の不備 / 日付が ISO でない / as_of が空</text>
<line x1="1272.0" y1="292" x2="1272.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1202.425" y="310" width="139.14999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1272.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">記号が登録表に無い</text>
<line x1="1588.0" y1="292" x2="1588.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1499.9" y="310" width="176.2" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1588.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">要求する欄が空(2 枠)</text>
<line x1="1904.0" y1="292" x2="1904.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1803.55" y="310" width="200.9" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1904.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">遡及の形なのに公表日が仮置き</text>
<line x1="2220.0" y1="292" x2="2220.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="2063.975" y="310" width="312.05" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="2220.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">known_to が閉じているのに後続行が無い</text>
<line x1="2536.0" y1="292" x2="2536.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="2398.5" y="310" width="275.0" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="2536.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">行 id が台帳に無い問い(分母は問い)</text>
<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">登録の側が壊れていたら、どの行も数えない(4 値は全て 0 で、理由コード 8 個のうち該当するものが返る)。別枠は 7 枠あるが、7 枠目だけ分母が問いなので行の件数の合計に混ぜない。列を足して引ける形にするのは asof_table、効き始める日が来ていない行は future_row、収録の端を 4 値にするのは cover_stock、値の裏付けの由来は backing_axis、valid_to を閉じる操作は edge_close の仕事で、ここは known の側の埋まり方だけを見る。</text>
</svg>