<svg xmlns="http://www.w3.org/2000/svg" width="1994" height="1448" viewBox="0 0 1994 1448" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1994" height="1448" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">年度をまたぐ重なりを、判定ごとに両経路そろえて並べる</text>
<text x="36" y="74" font-size="14" fill="#5b6272">経路 A = 去年の資料の「変更後」欄 / 経路 B = 今年の資料の「変更前」欄。どちらが正しいとは論じず、食い違う組み合わせを並べるだけ。件数は合成した 4 枚の表(抽出表 32 行 / 問い 17 件)の実測で、実在の料率・金額は 1 つも出さない。出典はファイル名を伏せた行番号。</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">合成データの件数(T1 × T2 / T2 × T3)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">経路 A(去年の資料の「変更後」欄)</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">経路 B(今年の資料の「変更前」欄)</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">この形が手元に在ることの出典</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">一致</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">6 件(2 / 4)</text>
<circle cx="216" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">突き合わせが成立した 8 件の</text>
<circle cx="216" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">うち値が同じだった側</text>
<rect x="636" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">去年の資料から採った値</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">原文: 雇用保険 隣接年度「前年の</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">変更後 = 今年の変更前」|</text>
<circle cx="662" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="674" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">R6→R7→R8 全項目 assert 通過</text>
<rect x="1082" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">今年の資料の変更前の欄</text>
<circle cx="1108" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ 1 行が検算の相手になる</text>
<circle cx="1108" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(採用元が別の欄のときだけ)</text>
<rect x="1528" y="132" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">作業状況 L89</text>
<circle cx="1554" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同文が 使い方 L43</text>
<circle cx="1554" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「隣接年 before=after 一致」</text>
<text x="172" y="399.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">不一致</text>
