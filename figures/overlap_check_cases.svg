<text x="674" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「支給限度額 上限額」vs「支給上限額」、</text>
<circle cx="662" cy="783" r="2.5" fill="#c2410c"/>
<text x="674" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記号) は正規化してから regex を当てれば</text>
