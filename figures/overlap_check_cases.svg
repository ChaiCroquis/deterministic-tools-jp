<text x="658" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">去年の変更後の値</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">資料 id と単位と出典が付く</text>
<circle cx="662" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="674" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(値は合成の記号)</text>
<rect x="1082" y="312" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">今年の変更前の値</text>
<circle cx="1108" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">資料 id と単位と出典が付く</text>
<circle cx="1108" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">食い違いの理由は人に戻す</text>
<rect x="1528" y="312" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">作業状況 L89 の対</text>
<circle cx="1554" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">assert が落ちた側の形</text>
<circle cx="1554" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(手元では通過している)</text>
<text x="172" y="579.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">重なりが無い</text>
<rect x="190" y="492" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">2 件(1 / 1)</text>
<circle cx="216" cy="555" r="2.5" fill="#5b6272"/>
<text x="228" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">新設とも廃止とも取り逃しとも</text>
<circle cx="216" cy="579" r="2.5" fill="#5b6272"/>
<text x="228" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">決めつけない 1 値にまとめる</text>
