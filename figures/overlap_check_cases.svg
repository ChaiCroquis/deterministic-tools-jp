<text x="1550" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">作業状況 L110</text>
<circle cx="1554" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">3 年分同じコードで通る、と</text>
<circle cx="1554" cy="759" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ行に書かれている</text>
<text x="172" y="939.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">採用元が同じ欄</text>
