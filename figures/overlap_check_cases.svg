<text x="1566" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同趣旨が 使い方 L53</text>
<text x="172" y="759.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">寄せ方が無い</text>
