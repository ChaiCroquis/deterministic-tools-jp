<text x="212" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">2 件(1 / 1)</text>
<circle cx="216" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="228" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">両側の値と出典を並べるだけ</text>
<circle cx="216" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="228" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">正を選ぶ欄は出力に無い</text>
