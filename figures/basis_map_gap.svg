<svg xmlns="http://www.w3.org/2000/svg" width="1994" height="1088" viewBox="0 0 1994 1088" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1994" height="1088" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">方針に書いてあることと、棚卸しの basis 列に実際に書かれていること</text>
<text x="36" y="74" font-size="14" fill="#5b6272">左が方針側(原文のまま)、右が同じ項目を棚卸しの列で数えた結果。嘘やごまかしではなく、原文自身が「追加候補」「次の一歩」と書いている。並べたのは乖離の事実だけで理由は推定していない。件数は丸めず、値(料率・金額)は原文が未取得と書いているので出さない。</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">方針側に何と書いてあるか(原文のまま)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">棚卸しの列では実際にどう書かれているか</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">件数</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">出典</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">① 種別は登録制</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">registry で登録制</text>
<circle cx="216" cy="195" r="2.5" fill="#5b6272"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「case のどの日付で有効期間を</text>
<circle cx="216" cy="219" r="2.5" fill="#5b6272"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">引くか …。registry で登録制」</text>
<rect x="636" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">列には書かれているが登録は別</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">basis 列に種別が並んでいる</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">うち「(basis 追加候補)」の</text>
<circle cx="662" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="674" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">但し書き付きが残っている</text>
<rect x="1082" y="132" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">12 通り / 58 行</text>
<circle cx="1108" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">但し書き付き 6 行を含む</text>
<rect x="1528" y="132" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">作業状況 L31</text>
<circle cx="1554" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">棚卸しの A 表(機械で数えた)</text>
<text x="172" y="399.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">② 表記ゆれの扱い</text>
<rect x="190" y="312" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">表記ゆれで別種別化しない</text>
<circle cx="216" cy="375" r="2.5" fill="#5b6272"/>
<text x="228" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「「賃金締切日」と「賃金締め日」の</text>
<circle cx="216" cy="399" r="2.5" fill="#5b6272"/>
<text x="228" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">表記ゆれで別種別化するのを防ぐ」</text>
<rect x="636" y="312" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">同じ種別が 2 通りの書かれ方で並ぶ</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">対象月初日(「(年度)」付き 1 行)</text>
<circle cx="662" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="674" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">資格取得日(候補付き 1 行)</text>
<circle cx="662" cy="423" r="2.5" fill="#3b5bdb"/>
<text x="674" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">支払日(候補付き 1 行)</text>
<rect x="1082" y="312" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">3 組</text>
<circle cx="1108" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">対象月初日 22 行 / 資格取得日 4 行</text>
<circle cx="1108" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">/ 支払日 3 行</text>
<rect x="1528" y="312" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">棚卸し L114</text>
<circle cx="1554" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">B 表 E2(機械で数えた)</text>
<text x="172" y="579.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">③ rule の追加</text>
<rect x="190" y="492" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">rule 追加 = 登録 1 行 + データ行</text>
<circle cx="216" cy="555" r="2.5" fill="#5b6272"/>
<text x="228" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「行が勝手に新 rule を名乗れない。</text>
<circle cx="216" cy="579" r="2.5" fill="#5b6272"/>
<text x="228" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">rule 追加 = registry 1 行 + データ行」</text>
<rect x="636" y="492" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">登録に無い種別を要求する行がある</text>
<circle cx="662" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="674" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">受講開始日 / 資格取得日 / 基準日</text>
<circle cx="662" cy="579" r="2.5" fill="#3b5bdb"/>
<text x="674" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">/ 出産予定日 / 認定日 / 支払日</text>
<circle cx="662" cy="603" r="2.5" fill="#3b5bdb"/>
<text x="674" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">原文が「追加候補」と自分で書く</text>
<rect x="1082" y="492" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">6 行</text>
<circle cx="1108" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">A 表の 50・51・85・86・94・101 行目</text>
<rect x="1528" y="492" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">棚卸し L113 / L105 / L144</text>
<circle cx="1554" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">L105「追加候補」L144「6 種別を追加」</text>
<text x="172" y="759.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">④ 基準日の欠落</text>
<rect x="190" y="672" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">基準日欠落は例外にする</text>
<circle cx="216" cy="735" r="2.5" fill="#5b6272"/>
<text x="228" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「同順位競合・基準日欠落・収録範囲外</text>
<circle cx="216" cy="759" r="2.5" fill="#5b6272"/>
<text x="228" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">は 例外 (黙って現行値を返さない)」</text>
<rect x="636" y="672" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">取り違えが実際に起きた記録がある</text>
<circle cx="662" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="674" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「有効期間 = 表の年度 (請求日)、</text>
<circle cx="662" cy="759" r="2.5" fill="#3b5bdb"/>
<text x="674" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">期間の月 = 表の中のキー」を</text>
<circle cx="662" cy="783" r="2.5" fill="#3b5bdb"/>
<text x="674" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">取り違えたのを検算が捕まえた</text>
<rect x="1082" y="672" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">1 件</text>
<circle cx="1108" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">検算が捕まえた(黙って通っていない)</text>
<rect x="1528" y="672" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">作業状況 L39 / L105</text>
<circle cx="1554" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">取り違えの記録は L105</text>
<text x="172" y="939.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">⑤ 方針の例示</text>
<rect x="190" y="852" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">例示は 6 語</text>
<circle cx="216" cy="915" r="2.5" fill="#5b6272"/>
<text x="228" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">対象月初日 / 賃金締切日 / 労働日 /</text>
<circle cx="216" cy="939" r="2.5" fill="#5b6272"/>
<text x="228" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">離職日 / 休業開始日 / 請求日</text>
<rect x="636" y="852" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">1 語は列に 1 行も無い</text>
<circle cx="662" cy="915" r="2.5" fill="#3b5bdb"/>
<text x="674" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">休業開始日が A 表の basis 列に無い</text>
<circle cx="662" cy="939" r="2.5" fill="#3b5bdb"/>
<text x="674" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(方針の例示と実務の列が一致しない)</text>
<rect x="1082" y="852" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">6 語中 1 語が 0 行</text>
<circle cx="1108" cy="915" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">残る 5 語は 22 / 4 / 4 / 4 / 10 行</text>
<rect x="1528" y="852" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">作業状況 L31</text>
<circle cx="1554" cy="915" r="2.5" fill="#3b5bdb"/>
<text x="1566" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">棚卸しの A 表(機械で数えた)</text>
<rect x="190" y="1042" width="18" height="14" rx="4" fill="#eef0f5" stroke="#d9dce6"/>
<text x="216" y="1054" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">方針側(原文のまま)</text>
<rect x="384" y="1042" width="18" height="14" rx="4" fill="#e7ecfb" stroke="#c4d0f6"/>
<text x="410" y="1054" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">棚卸しの列(実際の位置)</text>
</svg>