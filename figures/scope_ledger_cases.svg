<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">線の種類 × 判定の 4 値 — 公開済み 17 本の宣言を、走らせずに構文として突き合わせた結果</text>
<text x="36" y="74" font-size="14" fill="#5b6272">読み替え = 主体は道具 1 本ずつ、説明は宣言の verbatim、反応は静的な突合。見えるのは構文の形まで。一致しない行は行番号と verbatim だけ。読めない行にも出典。収集範囲は公開済み 17 本。遵守率は単独で出さない(読めた行のみ 0.7500 / 全行 0.3529)</text>
