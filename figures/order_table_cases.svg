<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">2 回並べて sha256 が一致</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行順を 3 通り入れ替えても一致</text>
<circle cx="662" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="674" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">ただし鍵が足りると止まる側へ</text>
