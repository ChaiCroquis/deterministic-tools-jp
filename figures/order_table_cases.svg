<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">連載が自分で書いた 5 つの宣言と、自分の記録で実際に起きたこと</text>
<text x="36" y="74" font-size="14" fill="#5b6272">読み替え = 方針側は公開済みの道具と記事に書いた宣言の verbatim、実務側は自分の台帳 11 行への観測と合成表への実走。見えるのは宣言された鍵で順が一意に決まるかまで。一致しない行に嘘・違反とは書かず、宣言と件数だけを置く。率は単独で出さない</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">公式にどう書かれているか</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">実際に何が起きたか</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">方針側の出典</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">実務側の出典</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">同じバイト列</text>
