<svg xmlns="http://www.w3.org/2000/svg" width="1912" height="402" viewBox="0 0 1912 402" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1912" height="402" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">毎年変わる数表の引き方 — 基準日 → 公表時点 → 有効期間 → 対象 → 最高 priority の 1 行</text>
<text x="36" y="74" font-size="14" fill="#5b6272">橙のピルが関所。決まらないときは理由コードで止まる。現行値や直近値へ落ちる経路はこの図に無い(fallback の引数も持たない)</text>
<rect x="36" y="118" width="260" height="148" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="36" y="118" width="260" height="6" rx="3" fill="#e7ecfb"/>
<circle cx="62" cy="152" r="14" fill="#3b5bdb"/>
<text x="62" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="84" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">基準日を取る</text>
<circle cx="60" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="72" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">key の行を集める</text>
<circle cx="60" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="72" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行が宣言した basis を読む</text>
<circle cx="60" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="72" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">case からその日付を取る</text>
<line x1="304" y1="192.0" x2="344" y2="192.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="352" y="118" width="260" height="148" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="352" y="118" width="260" height="6" rx="3" fill="#d6def9"/>
<circle cx="378" cy="152" r="14" fill="#3b5bdb"/>
<text x="378" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="400" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">知識時間で絞る</text>
<circle cx="376" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="388" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">as_of 省略 = いまの知識</text>
<circle cx="376" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="388" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">known_from / known_to で絞る</text>
<circle cx="376" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="388" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">公表日が仮置きの行は止める</text>
<line x1="620" y1="192.0" x2="660" y2="192.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="668" y="118" width="260" height="148" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="668" y="118" width="260" height="6" rx="3" fill="#c4d0f6"/>
<circle cx="694" cy="152" r="14" fill="#3b5bdb"/>
<text x="694" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="716" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">有効時間で絞る</text>
<circle cx="692" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="704" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">case の基準日が半開区間か</text>
<circle cx="692" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="704" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">境界は valid_from 側に入る</text>
<circle cx="692" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="704" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">施行日未定の行は当たらない</text>
<line x1="936" y1="192.0" x2="976" y2="192.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="984" y="118" width="260" height="148" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="984" y="118" width="260" height="6" rx="3" fill="#b0c1f2"/>
<circle cx="1010" cy="152" r="14" fill="#3b5bdb"/>
<text x="1010" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="1032" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">対象で絞る</text>
<circle cx="1008" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">sel_ の次元で照合する</text>
<circle cx="1008" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行の空欄はワイルドカード</text>
<circle cx="1008" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">次元を足しても既存行は無修正</text>
<line x1="1252" y1="192.0" x2="1292" y2="192.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1300" y="118" width="260" height="148" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1300" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1326" cy="152" r="14" fill="#3b5bdb"/>
<text x="1326" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="1348" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">最高 priority の 1 行</text>
<circle cx="1324" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">0 本則 / 10 経過措置 / 20 特例</text>
<circle cx="1324" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同順位が 2 本なら止める</text>
<circle cx="1324" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">細かい指定を自動で優先しない</text>
<line x1="1568" y1="192.0" x2="1608" y2="192.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1616" y="118" width="260" height="148" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1616" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1642" cy="152" r="14" fill="#3b5bdb"/>
<text x="1642" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="1664" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">出典を付けて返す</text>
<circle cx="1640" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">値は文字列のまま返す</text>
<circle cx="1640" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">source と valid_from を添える</text>
<circle cx="1640" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">使った行番号も添える</text>
<line x1="324.0" y1="268" x2="324.0" y2="284" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="229.72500000000002" y="286" width="188.54999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="324.0" y="305" font-size="13" text-anchor="middle" fill="#c2410c">基準日が case に無い</text>
<line x1="640.0" y1="268" x2="640.0" y2="284" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="490.15" y="286" width="299.7" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="640.0" y="305" font-size="13" text-anchor="middle" fill="#c2410c">as_of 時点で未公表 / 公表日が仮置き</text>
<line x1="1272.0" y1="268" x2="1272.0" y2="284" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1165.375" y="286" width="213.25" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1272.0" y="305" font-size="13" text-anchor="middle" fill="#c2410c">収録範囲の外(期間の穴を含む)</text>
<line x1="1588.0" y1="268" x2="1588.0" y2="284" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1524.6" y="286" width="126.8" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1588.0" y="305" font-size="13" text-anchor="middle" fill="#c2410c">同順位で複数該当</text>
<text x="36" y="372" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">止まった時に返すのは理由コードと行番号だけで、値は返さない。表そのものの検査(重なり・穴・基準日の揺れ)は validate が別に見る。</text>
</svg>