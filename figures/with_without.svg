<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="908" viewBox="0 0 1102 908" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1102" height="908" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">同じ仕事を、道具なしでやる場合と、AI + 決定論の道具で組み直した場合</text>
<text x="36" y="74" font-size="14" fill="#5b6272">4 つの観点で比べる。数字は私の記録にあるものだけ</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">道具なし(いまのやり方)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">AI + 決定論の道具(組み直した後)</text>
<text transform="translate(36,484.0) rotate(-90)" font-size="13" text-anchor="middle" fill="#5b6272">観点</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">時間</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">毎回、人の手で</text>
<circle cx="216" cy="195" r="2.5" fill="#5b6272"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ突合を毎月やり直す</text>
<circle cx="216" cy="219" r="2.5" fill="#5b6272"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">料率の年次更新を目視で追う</text>
<circle cx="216" cy="243" r="2.5" fill="#5b6272"/>
<text x="228" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1 社の変換に 4〜5 日(私の記録)</text>
<rect x="636" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">1 回書けば繰り返しは機械</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">突合はスクリプトが実行</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">料率は週 1 回、自動で公式 source から更新</text>
<circle cx="662" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="674" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ変換は次から分単位</text>
<text x="172" y="399.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">誤りの見つかり方</text>
<rect x="190" y="312" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">気づいた人が気づいた時に</text>
<circle cx="216" cy="375" r="2.5" fill="#5b6272"/>
<text x="228" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">取込後に SaaS 側で弾かれて分かる</text>
<circle cx="216" cy="399" r="2.5" fill="#5b6272"/>
<text x="228" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">合計が合わない理由を後から探す</text>
<circle cx="216" cy="423" r="2.5" fill="#5b6272"/>
<text x="228" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">見つからなかった誤りは残る</text>
<rect x="636" y="312" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">検証を先に置く</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">縦横の検算が合わないと取込を止める</text>
<circle cx="662" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="674" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">何件一致したかが数字で残る</text>
<circle cx="662" cy="423" r="2.5" fill="#3b5bdb"/>
<text x="674" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">誤りは公開前・取込前に出る</text>
<text x="172" y="579.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">引き継ぎ・再現</text>
<rect x="190" y="492" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">その人の頭の中</text>
<circle cx="216" cy="555" r="2.5" fill="#5b6272"/>
<text x="228" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">手順は本人しか知らない</text>
<circle cx="216" cy="579" r="2.5" fill="#5b6272"/>
<text x="228" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">休むと止まる</text>
<circle cx="216" cy="603" r="2.5" fill="#5b6272"/>
<text x="228" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ処理が 17 か所に別実装(私の記録)</text>
<rect x="636" y="492" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">手順が文書とコードで残る</text>
<circle cx="662" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="674" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記事 1 本 = 道具 1 個</text>
<circle cx="662" cy="579" r="2.5" fill="#3b5bdb"/>
<text x="674" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">他の人が同じ結果を出せる</text>
<circle cx="662" cy="603" r="2.5" fill="#3b5bdb"/>
<text x="674" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">共通部品は 1 か所に</text>
<text x="172" y="759.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">気持ち</text>
<rect x="190" y="672" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">確認しきれない不安</text>
<circle cx="216" cy="735" r="2.5" fill="#5b6272"/>
<text x="228" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「見落としていないか」が消えない</text>
<circle cx="216" cy="759" r="2.5" fill="#5b6272"/>
<text x="228" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">繁忙期に集中する</text>
<rect x="636" y="672" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">機械が確認した範囲が分かる</text>
<circle cx="662" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="674" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">人が見るのは機械が拾えない判断だけ</text>
<circle cx="662" cy="759" r="2.5" fill="#3b5bdb"/>
<text x="674" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">できないことも明示されている</text>
<rect x="190" y="862" width="18" height="14" rx="4" fill="#eef0f5" stroke="#d9dce6"/>
<text x="216" y="874" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">道具なし</text>
<rect x="300" y="862" width="18" height="14" rx="4" fill="#e7ecfb" stroke="#c4d0f6"/>
<text x="326" y="874" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">組み直した後</text>
</svg>