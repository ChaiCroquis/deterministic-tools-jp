<circle cx="662" cy="855" r="2.5" fill="#3b5bdb"/>
<text x="674" y="860" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1 行に 2 か所あれば列の順で並ぶ</text>
