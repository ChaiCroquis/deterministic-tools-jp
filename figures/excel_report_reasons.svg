<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">塗りしか残らない</text>
<circle cx="216" cy="195" r="2.5" fill="#c2410c"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">空欄が塗られているだけ</text>
<circle cx="216" cy="219" r="2.5" fill="#c2410c"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">空欄と入力漏れの区別が付かない</text>
<circle cx="216" cy="243" r="2.5" fill="#c2410c"/>
<text x="228" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">CSV 化すると 0 件になる</text>
<circle cx="216" cy="267" r="2.5" fill="#c2410c"/>
<text x="228" y="272" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">凡例が無いので色の意味も不明</text>
<rect x="636" y="132" width="430" height="188" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">値として残る</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由コード列に「値が無い」</text>
