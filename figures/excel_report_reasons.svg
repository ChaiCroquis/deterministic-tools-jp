<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="1208" viewBox="0 0 1102 1208" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1102" height="1208" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">軸を差し替えた一覧 — 行は「部品」ではなく「理由の種類」(何が足りないから機械で決まらないか)</text>
<text x="36" y="74" font-size="14" fill="#5b6272">合成データで実測(tests/test_excel_report.py)。列は、その理由が出力のどこに置かれ、値だけを読む工程で残るか落ちるか</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">色だけで示す(塗りが唯一の運び手)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">この部品(理由コード列 + 凡例 + 判断待ちシート + 塗り)</text>
<text x="172" y="231.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">値が無い</text>
