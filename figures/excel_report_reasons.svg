<text x="674" y="476" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">表を直す判断は人に残る</text>
<text x="172" y="639.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">相手が決まらない</text>
