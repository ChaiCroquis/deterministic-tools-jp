<circle cx="662" cy="267" r="2.5" fill="#3b5bdb"/>
<text x="674" y="272" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">CSV 化しても残る</text>
<text x="172" y="435.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">表の外にある</text>
