<circle cx="216" cy="1011" r="2.5" fill="#c2410c"/>
<text x="228" y="1016" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">色が消えると手がかりが無くなる</text>
<circle cx="216" cy="1035" r="2.5" fill="#c2410c"/>
<text x="228" y="1040" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">波ダッシュと全角チルダが同じに見える</text>
<circle cx="216" cy="1059" r="2.5" fill="#c2410c"/>
<text x="228" y="1064" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">CSV 化すると 0 件になる</text>
<circle cx="216" cy="1083" r="2.5" fill="#c2410c"/>
<text x="228" y="1088" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">座標を控えないと元のセルに戻れない</text>
