<rect width="1994" height="1280" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">式が呼べる 7 語を、働きの記号の軸で並べ直して記載を横に置く</text>
<text x="36" y="74" font-size="14" fill="#5b6272">旧軸 = 一覧に書かれた順(1〜7)。新軸 = 人が登録した働きの記号。旧軸との違いは、隣り合っていた語が別の段に分かれ、段ごとに式の側と検証の側の記載が並ぶこと</text>
<text x="1074.0" y="92" font-size="13" font-weight="normal" text-anchor="middle" fill="#5b6272">件数は丸めていない。働きの記号と対応は人が登録したもの。どの式がどの語を呼ぶかは 2 文書に書かれていない。記載なしは 2 文書を読んだ範囲の話で、試験の有無ではない。網羅ではない</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">旧軸の順と働きの記号</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">式の一覧の側の記載</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">検証の表の側の記載と結果</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">区分</text>
<text transform="translate(36,670.0) rotate(-90)" font-size="13" text-anchor="middle" fill="#5b6272">式が呼べる語(働きの記号ごとの段 → 旧軸の順)</text>
<text x="172" y="207.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">piecewise</text>
