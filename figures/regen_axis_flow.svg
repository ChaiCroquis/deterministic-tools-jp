<rect width="2228" height="426" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">ファイルごとに区分を出すまでの流れと、止まる場所</text>
<text x="36" y="74" font-size="14" fill="#5b6272">橙のピルが関所。ディスクを歩く経路・中身や更新時刻を読む経路・消す経路・消してよいかを決める経路・名前から書き手を当てる経路・文言の意味を読む経路・時計を読む経路は、この図に無い(引数が無い)。</text>
