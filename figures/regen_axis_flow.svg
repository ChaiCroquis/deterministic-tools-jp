<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">別枠の理由は 6 つで、手前の関門が勝つ。更新の台帳そのもの・計算の入力を辿ること・宣言した周期と実行の履歴・出どころの許諾・表に入らない項目の埋め手は、それぞれ別の部品の仕事で、この図にその経路は無い。</text>
