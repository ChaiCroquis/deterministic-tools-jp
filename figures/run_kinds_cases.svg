<svg xmlns="http://www.w3.org/2000/svg" width="1994" height="908" viewBox="0 0 1994 908" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1994" height="908" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">台帳の 1 列目をそのまま読んだときと、同じ台帳の他の欄から読んだときの差</text>
<text x="36" y="74" font-size="14" fill="#5b6272">前提の側も観測の側も、同じ 1 つの実行の台帳から出ている(外部の一般論ではない)。出典は URL でなく、ファイル名を伏せた行番号。実在の料率も金額も入れていない(件数と指紋の先頭だけ)。説明の出典が無いものは、埋めずに残差と書く。</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">2 値のまま読むとこう読める</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">同じ台帳の他の欄から読むと</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">差を説明する出典</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">説明の出典が無い残差</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">通った = 更新</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">通ったのは 9 回</text>
<circle cx="216" cy="195" r="2.5" fill="#5b6272"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録の形は status と差分と</text>
<circle cx="216" cy="219" r="2.5" fill="#5b6272"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">指紋を同じ行に持つ</text>
<circle cx="216" cy="243" r="2.5" fill="#5b6272"/>
<text x="228" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(記録の形 = 使い方の記録 L15)</text>
<rect x="636" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">入れ替わったのは 4 回</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">初回 1 / 差分 0 で指紋も同じ 3</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">/ 入れ替わった 4 / 噛み合わない 1</text>
<circle cx="662" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="674" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(11 行を数え直した)</text>
<rect x="1082" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">据え置きの宣言が在る</text>
<circle cx="1108" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">全段通るまで本番 file を触らない</text>
<circle cx="1108" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">= 使い方の記録 L12</text>
<circle cx="1108" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">冪等性 = 作業状況の記録 L97</text>
<rect x="1528" y="132" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a"></text>
<circle cx="1554" cy="195" r="2.5" fill="#c2410c"/>
<text x="1566" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分 0 の回が「走って変わらない」</text>
<circle cx="1554" cy="219" r="2.5" fill="#c2410c"/>
<text x="1566" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">のか「取りに行かなかった」のかは</text>
<circle cx="1554" cy="243" r="2.5" fill="#c2410c"/>
<text x="1566" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録に書かれていない</text>
<text x="172" y="399.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">落ちた = 障害</text>
<rect x="190" y="312" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">落ちたのは 2 回</text>
<circle cx="216" cy="375" r="2.5" fill="#5b6272"/>
<text x="228" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1 列目は通った / 落ちたの</text>
<circle cx="216" cy="399" r="2.5" fill="#5b6272"/>
<text x="228" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">2 値しか持たない</text>
<circle cx="216" cy="423" r="2.5" fill="#5b6272"/>
<text x="228" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(記録の形 = 使い方の記録 L15)</text>
<rect x="636" y="312" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">どちらも据え置き</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分も指紋も空の回 2</text>
<circle cx="662" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="674" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">本番は前回のまま</text>
<circle cx="662" cy="423" r="2.5" fill="#3b5bdb"/>
<text x="674" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(落ちた回に動いた印は無い)</text>
<rect x="1082" y="312" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">試験と注記されている</text>
<circle cx="1108" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">意図的な失敗試験</text>
<circle cx="1108" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">= 作業状況の記録 L99</text>
<circle cx="1108" cy="423" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">失敗経路 = 同 L96 / 据え置き = 同 L51</text>
<rect x="1528" y="312" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">宣言は事後</text>
<circle cx="1554" cy="375" r="2.5" fill="#c2410c"/>
<text x="1566" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">注記が書かれたのは実行の翌日で、</text>
<circle cx="1554" cy="399" r="2.5" fill="#c2410c"/>
<text x="1566" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実行より前に書かれた宣言は</text>
<circle cx="1554" cy="423" r="2.5" fill="#c2410c"/>
<text x="1566" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">手元に無い(道具は ② 側へ置く)</text>
<text x="172" y="579.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">差分 0 = 不変</text>
<rect x="190" y="492" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">差分 0 の回は 4 回</text>
<circle cx="216" cy="555" r="2.5" fill="#5b6272"/>
<text x="228" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">通った回のうち、差分の件数 3 つ</text>
<circle cx="216" cy="579" r="2.5" fill="#5b6272"/>
<text x="228" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">が全部 0 の回</text>
<circle cx="216" cy="603" r="2.5" fill="#5b6272"/>
<text x="228" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(件数は台帳の欄そのまま)</text>
<rect x="636" y="492" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">うち 1 回は指紋が動いた</text>
<circle cx="662" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="674" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分 0 かつ指紋が直前と同じ 3</text>
<circle cx="662" cy="579" r="2.5" fill="#3b5bdb"/>
<text x="674" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分 0 なのに指紋が動いた 1</text>
<circle cx="662" cy="603" r="2.5" fill="#3b5bdb"/>
<text x="674" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(同じ 4 回の中で分かれる)</text>
<rect x="1082" y="492" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">冪等性の宣言が在る</text>
<circle cx="1108" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">offline 再実行で差分 0、sha 同一</text>
<circle cx="1108" cy="579" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">= 作業状況の記録 L97</text>
<rect x="1528" y="492" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a"></text>
<circle cx="1554" cy="555" r="2.5" fill="#c2410c"/>
<text x="1566" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分 0 で指紋だけが動いた 1 回を</text>
<circle cx="1554" cy="579" r="2.5" fill="#c2410c"/>
<text x="1566" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">説明する行は記録に無い</text>
<circle cx="1554" cy="603" r="2.5" fill="#c2410c"/>
<text x="1566" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(どちらが正しいとも書かない)</text>
<text x="172" y="759.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">指紋違い = 新規</text>
<rect x="190" y="672" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">指紋が動いたのは 5 回</text>
<circle cx="216" cy="735" r="2.5" fill="#5b6272"/>
<text x="228" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">直前の行と指紋が違う回</text>
<circle cx="216" cy="759" r="2.5" fill="#5b6272"/>
<text x="228" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(遡って空でない指紋と比べる)</text>
<rect x="636" y="672" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">1 回は前の値へ戻った</text>
<circle cx="662" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="674" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">戻りの印が付くのは 1 回</text>
<circle cx="662" cy="759" r="2.5" fill="#3b5bdb"/>
<text x="674" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ指紋が前に 2 回出ている</text>
<circle cx="662" cy="783" r="2.5" fill="#3b5bdb"/>
<text x="674" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">最新の指紋は 151d31f0…</text>
<rect x="1082" y="672" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">最新の指紋は記録に在る</text>
<circle cx="1108" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">最新 sha256 151d31f0…</text>
<circle cx="1108" cy="759" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">= 作業状況の記録 L99</text>
<circle cx="1108" cy="783" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">全実行の履歴 = 使い方の記録 L15</text>
<rect x="1528" y="672" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1550" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a"></text>
<circle cx="1554" cy="735" r="2.5" fill="#c2410c"/>
<text x="1566" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">前の値へ戻った 1 回を説明する行は</text>
<circle cx="1554" cy="759" r="2.5" fill="#c2410c"/>
<text x="1566" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記録に無い(戻した操作なのか、</text>
<circle cx="1554" cy="783" r="2.5" fill="#c2410c"/>
<text x="1566" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じ中身に行き着いたのかは不明)</text>
<rect x="190" y="862" width="18" height="14" rx="4" fill="#eef0f5" stroke="#d9dce6"/>
<text x="216" y="874" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">1 列目だけを読んだときの前提</text>
<rect x="454" y="862" width="18" height="14" rx="4" fill="#e7ecfb" stroke="#c4d0f6"/>
<text x="480" y="874" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">台帳の他の欄に在る観測と宣言</text>
<rect x="704" y="862" width="18" height="14" rx="4" fill="#fff1e8" stroke="#f5c9ae"/>
<text x="730" y="874" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">説明の出典が無い残差</text>
</svg>