<rect width="1994" height="1276" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">線にちょうど当たる 8 件 — 帯の軸は記録に在り、等号の向きが行から取れるのは 4 件</text>
<text x="36" y="74" font-size="14" fill="#5b6272">収集範囲は私の棚卸し記録(非公開)に載っている範囲に限る(制度を網羅して読んだわけではない)。値(料率・金額・境界額)は出さない。残りの断りは本文に書いた。</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">どの線に触れているか</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">等号の向きは行から取れるか</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">動かした主体</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">改定の列に載っている日付</text>
<text x="172" y="197.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">月額が等級の境目</text>
