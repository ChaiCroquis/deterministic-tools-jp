<text x="36" y="74" font-size="14" fill="#5b6272">読み替え = 許可の根拠は「テストファイルが在ること」、滞留している量は「本数」、滞留の理由は出典が無いので書かない。宣言の数(手元の記録 39 / 18 / 10 本、grep ベース・未実行)と実走の数(合成プロジェクト 10 行)は同じセルに混ぜず別に置く。記録の側は 1 件も走らせていない。合格率は単独で出さない(走らせた行のみ 0.5000 / 宣言の行すべて 0.3000)</text>
