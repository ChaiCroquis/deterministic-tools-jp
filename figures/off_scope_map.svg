<svg xmlns="http://www.w3.org/2000/svg" width="1548" height="1268" viewBox="0 0 1548 1268" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1548" height="1268" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">「対象外」と書いた項目を、領域の宣言と在り所と入る形で並べた表</text>
<text x="36" y="74" font-size="14" fill="#5b6272">行 = 線に触れている項目(主体は人や組織ではなく表の項目)、列 = ① 領域と必須の宣言 / ② 在り所 / ③ 入る形と行き先 → 4 値。収録すべきかの列・優先順位の列・カバー率の行は置かない。</text>
<text x="851.0" y="92" font-size="13" font-weight="normal" text-anchor="middle" fill="#5b6272">対象外と言える根拠は、どの層に何と書かれているか</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">① 領域と必須の宣言(出典つき)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">② 在り所(行数と由来)</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">③ 入る形と行き先 → 4 値</text>
<text transform="translate(36,664.0) rotate(-90)" font-size="13" text-anchor="middle" fill="#5b6272">線に触れている項目(私の棚卸しの表から起こしたもの)</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">源泉徴収税額表</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">境界として明示 + 必須の宣言</text>
<circle cx="216" cy="195" r="2.5" fill="#5b6272"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「社労士 scope 外だが給与計算に必須、境界として明示」</text>
<circle cx="216" cy="219" r="2.5" fill="#5b6272"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 棚卸しの表 97 行目(章の見出し)</text>
<circle cx="216" cy="243" r="2.5" fill="#5b6272"/>
<text x="228" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">項目の行は同 101 行目</text>
<rect x="636" y="132" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">在り所 = 無い</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">表に行は 1 行も無い</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行数は `数えられない`(0 行とは書けない)</text>
<circle cx="662" cy="243" r="2.5" fill="#3b5bdb"/>
<text x="674" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">備考 =「税理士領域との境界」</text>
<rect x="1082" y="132" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">別枠 basis の欄名が登録表に無い</text>
<circle cx="1108" cy="195" r="2.5" fill="#c2410c"/>
<text x="1120" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">入る形は 3 欄とも書かれている</text>
<circle cx="1108" cy="219" r="2.5" fill="#c2410c"/>
<text x="1120" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">basis =「支払日」は候補の側(105 行目)</text>
<circle cx="1108" cy="243" r="2.5" fill="#c2410c"/>
<text x="1120" y="248" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">→ (D) へ進む手前で別枠へ出る</text>
<text x="172" y="399.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">定額減税</text>
<rect x="190" y="312" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">境界として明示 + 期間の終わり</text>
<circle cx="216" cy="375" r="2.5" fill="#5b6272"/>
<text x="228" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「定額減税 | 支払日 | — | param | 2024 年限り」</text>
<circle cx="216" cy="399" r="2.5" fill="#5b6272"/>
<text x="228" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 同 102 行目</text>
<circle cx="216" cy="423" r="2.5" fill="#5b6272"/>
<text x="228" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">備考 =「valid 閉鎖行」</text>
<rect x="636" y="312" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">在り所 = 無い</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">表に行は 1 行も無い</text>
<circle cx="662" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="674" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行数は `数えられない`</text>
<rect x="1082" y="312" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">別枠 basis の欄名が登録表に無い</text>
<circle cx="1108" cy="375" r="2.5" fill="#c2410c"/>
<text x="1120" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">期間の終わりの記載も在る(別枠 2 つめ)</text>
<circle cx="1108" cy="399" r="2.5" fill="#c2410c"/>
<text x="1120" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">先に当たるのは basis の別枠</text>
<circle cx="1108" cy="423" r="2.5" fill="#c2410c"/>
<text x="1120" y="428" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">足りないものが 2 つ重なって見える</text>
<text x="172" y="579.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">住民税</text>
<rect x="190" y="492" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">境界として明示 + 行き先の備考</text>
<circle cx="216" cy="555" r="2.5" fill="#5b6272"/>
<text x="228" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「住民税 (特別徴収) | 支払日 | — | — | 市区町村通知」</text>
<circle cx="216" cy="579" r="2.5" fill="#5b6272"/>
<text x="228" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 同 103 行目</text>
<circle cx="216" cy="603" r="2.5" fill="#5b6272"/>
<text x="228" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">payload の欄と出典の欄が `—`</text>
<rect x="636" y="492" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">行き先の宣言が 2 か所</text>
<circle cx="662" cy="555" r="2.5" fill="#3b5bdb"/>
<text x="674" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">A7 の備考 =「個人別通知 = C2」(103 行目)</text>
<circle cx="662" cy="579" r="2.5" fill="#3b5bdb"/>
<text x="674" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">C 章 =「住民税額」は第 2 層(130 行目)</text>
<circle cx="662" cy="603" r="2.5" fill="#3b5bdb"/>
<text x="674" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どちらが本当かを道具は決めない</text>
<rect x="1082" y="492" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">別枠 2 か所で別の行き先</text>
<circle cx="1108" cy="555" r="2.5" fill="#c2410c"/>
<text x="1120" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">payload の欄が空も別枠の 1 つ</text>
<circle cx="1108" cy="579" r="2.5" fill="#c2410c"/>
<text x="1120" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">先に当たるのは行き先の別枠</text>
<circle cx="1108" cy="603" r="2.5" fill="#c2410c"/>
<text x="1120" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">→ 4 値には入らない</text>
<text x="172" y="759.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">消費税率</text>
<rect x="190" y="672" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">境界として明示(同じ税の領域)</text>
<circle cx="216" cy="735" r="2.5" fill="#5b6272"/>
<text x="228" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">税は「社労士 scope 外」と宣言された領域</text>
<circle cx="216" cy="759" r="2.5" fill="#5b6272"/>
<text x="228" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 棚卸しの表 97 行目</text>
<circle cx="216" cy="783" r="2.5" fill="#5b6272"/>
<text x="228" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">必須の宣言も同じ 1 行に在る</text>
<rect x="636" y="672" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">在り所 = 収録(由来 = 上流)</text>
<circle cx="662" cy="735" r="2.5" fill="#3b5bdb"/>
<text x="674" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「消費税率 標準/軽減 (4/1、1989〜)」</text>
<circle cx="662" cy="759" r="2.5" fill="#3b5bdb"/>
<text x="674" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 作業状況の記録 70 行目</text>
<circle cx="662" cy="783" r="2.5" fill="#3b5bdb"/>
<text x="674" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">同じことを README の 42 行目も書く</text>
<rect x="1082" y="672" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">(B) 外と宣言したのに行が在る</text>
<circle cx="1108" cy="735" r="2.5" fill="#c2410c"/>
<text x="1120" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行数は 5 行、由来は上流の JSON</text>
<circle cx="1108" cy="759" r="2.5" fill="#c2410c"/>
<text x="1120" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1989 年から引ける</text>
<circle cx="1108" cy="783" r="2.5" fill="#c2410c"/>
<text x="1120" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">入る形の宣言は無いまま行が在る</text>
<text x="172" y="939.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">要件該当性の判断</text>
<rect x="190" y="852" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">外(表に入らないものの章)</text>
<circle cx="216" cy="915" r="2.5" fill="#5b6272"/>
<text x="228" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「設計上の対象外 (rule_catalog.md C 章)」</text>
<circle cx="216" cy="939" r="2.5" fill="#5b6272"/>
<text x="228" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 作業状況の記録 131 行目</text>
<circle cx="216" cy="963" r="2.5" fill="#5b6272"/>
<text x="228" y="968" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">必須の宣言は書かれていない</text>
<rect x="636" y="852" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">在り所 = case属性</text>
<circle cx="662" cy="915" r="2.5" fill="#3b5bdb"/>
<text x="674" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「判断結果を case 属性として受け取る前提」</text>
<circle cx="662" cy="939" r="2.5" fill="#3b5bdb"/>
<text x="674" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行は無いが、行き先は書かれている</text>
<circle cx="662" cy="963" r="2.5" fill="#3b5bdb"/>
<text x="674" y="968" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">C2 の例は第 2 層(130 行目)</text>
<rect x="1082" y="852" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">(C) 行き先だけ在る</text>
<circle cx="1108" cy="915" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行数は `数えられない`</text>
<circle cx="1108" cy="939" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「できていないこと」の表には在る</text>
<circle cx="1108" cy="963" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="968" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">税の 3 項目はその表に出てこない</text>
<text x="172" y="1119.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">照合用の上流 JSON</text>
<rect x="190" y="1032" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="1068" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">内(社会保険の領域)</text>
<circle cx="216" cy="1095" r="2.5" fill="#5b6272"/>
<text x="228" y="1100" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">線の内側なので、この部品の対象の外</text>
<circle cx="216" cy="1119" r="2.5" fill="#5b6272"/>
<text x="228" y="1124" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 作業状況の記録 68 行目の章</text>
<circle cx="216" cy="1143" r="2.5" fill="#5b6272"/>
<text x="228" y="1148" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">必須の宣言は要らない側</text>
<rect x="636" y="1032" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="1068" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">在り所 = 照合専用</text>
<circle cx="662" cy="1095" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1100" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「協会けんぽの上流 JSON は 照合専用」</text>
<circle cx="662" cy="1119" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1124" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「47 支部一致を毎回 assert」(72 行目)</text>
<circle cx="662" cy="1143" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1148" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行は在るが、引く対象ではない</text>
<rect x="1082" y="1032" width="430" height="164" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="1104" y="1068" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">(D) 内 と宣言</text>
<circle cx="1108" cy="1095" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="1100" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行が在っても (B) には入らない</text>
<circle cx="1108" cy="1119" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="1124" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「在る」と「引く対象」は別の事実</text>
<circle cx="1108" cy="1143" r="2.5" fill="#3b5bdb"/>
<text x="1120" y="1148" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">列には行数と由来が残る</text>
<rect x="190" y="1222" width="18" height="14" rx="4" fill="#eef0f5" stroke="#d9dce6"/>
<text x="216" y="1234" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">宣言(出典つき)</text>
<rect x="356" y="1222" width="18" height="14" rx="4" fill="#ffffff" stroke="#d9dce6"/>
<text x="382" y="1234" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">在り所の宣言</text>
<rect x="494" y="1222" width="18" height="14" rx="4" fill="#e7ecfb" stroke="#c4d0f6"/>
<text x="520" y="1234" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">表の中で動いている行</text>
<rect x="688" y="1222" width="18" height="14" rx="4" fill="#fff1e8" stroke="#f5c9ae"/>
<text x="714" y="1234" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">4 値が付かず別枠へ出た項目</text>
