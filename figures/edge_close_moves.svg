<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">端が動いた瞬間を、私の記録に出典がある分だけ 1 行 1 件で並べたもの</text>
<text x="36" y="74" font-size="14" fill="#5b6272">行 = 端が動いた瞬間、列 = 効き始める日 / どの数表 / 開いたか閉じたか / 動かした主体 / 出典(行番号)。是非を書く列は置かない。実在の料率も金額も入れていない(入るのは日付と件数だけ)。日付が記録に無いものは下の別枠に置いた(並べられるものと並べられないものを 1 つの表で足さない)。</text>
