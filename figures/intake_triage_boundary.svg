<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">機械が決めてよい境界は、値ではなく宣言の側で決まる — 違反がどの分類に落ちるか</text>
<text x="36" y="74" font-size="14" fill="#5b6272">出典 = 私の記録(非公開)と、その場で実走した仕分け(合成 18 行 / 違反 12 件)。B1 の「各セルに規制文書の URL」は仕様表の名前 + sha256 に読み替えた。1 欄だけ違う仕様表 2 枚で線が動く(6 / 6 / 6 → 6 / 5 / 7)。収集は私の記録の範囲</text>
