<svg xmlns="http://www.w3.org/2000/svg" width="2544" height="426" viewBox="0 0 2544 426" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="2544" height="426" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">主の出どころが替わった動きを順に歩いて、rule ごとの区分を付けるまでの流れ</text>
<text x="36" y="74" font-size="14" fill="#5b6272">橙のピルが関所。値を比べる経路・実行の台帳の増減の件数を rule に割り振る経路・日付を補う経路・理由を言い当てる経路・よい側を決める経路・一致率を単独で出す経路・時計を読む経路は、この図に無い(引数が無い)。</text>
<rect x="36" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="36" y="118" width="260" height="6" rx="3" fill="#e7ecfb"/>
<circle cx="62" cy="152" r="14" fill="#3b5bdb"/>
<text x="62" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="84" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">5 表を読む</text>
<circle cx="60" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="72" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">動きの台帳は 10 列</text>
<circle cx="60" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="72" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出どころと役の登録表</text>
<circle cx="60" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="72" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">引き継ぎの突合の台帳</text>
<circle cx="60" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="72" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">いまの由来の台帳</text>
<line x1="304" y1="204.0" x2="344" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="352" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="352" y="118" width="260" height="6" rx="3" fill="#d6def9"/>
<circle cx="378" cy="152" r="14" fill="#3b5bdb"/>
<text x="378" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="400" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">出典と登録を見る</text>
<circle cx="376" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="388" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行ごとに出典が在るか</text>
<circle cx="376" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="388" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出どころ id が登録表に在るか</text>
<circle cx="376" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="388" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">役の記号が登録表に在るか</text>
<circle cx="376" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="388" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">種別は写すだけで比べない</text>
<line x1="620" y1="204.0" x2="660" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="668" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="668" y="118" width="260" height="6" rx="3" fill="#c4d0f6"/>
<circle cx="694" cy="152" r="14" fill="#3b5bdb"/>
<text x="694" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="716" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">順の番号を見る</text>
<circle cx="692" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="704" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">整数として読めるか</text>
<circle cx="692" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="704" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">台帳の中で重複しないか</text>
<circle cx="692" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="704" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">並べる鍵はこの整数だけ</text>
<circle cx="692" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="704" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">日付は写すだけで読まない</text>
<line x1="936" y1="204.0" x2="976" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="984" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="984" y="118" width="260" height="6" rx="3" fill="#b0c1f2"/>
<circle cx="1010" cy="152" r="14" fill="#3b5bdb"/>
<text x="1010" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="1032" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">rule ごとに線をつなぐ</text>
<circle cx="1008" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">動きを順の番号で並べる</text>
<circle cx="1008" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">前の動きの後 = 次の動きの前か</text>
<circle cx="1008" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">前が空 = 無かった(最初に置いた)</text>
<circle cx="1008" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">前が在るのに役が空なら止める</text>
<line x1="1252" y1="204.0" x2="1292" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1300" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1300" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1326" cy="152" r="14" fill="#3b5bdb"/>
<text x="1326" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="1348" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">突合を動きに結ぶ</text>
<circle cx="1324" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">件数は 0 以上の整数か</text>
<circle cx="1324" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">一致 ≦ 比べた か</text>
<circle cx="1324" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">比べた件数と一致した件数を並べる</text>
<circle cx="1324" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">範囲の文字列が同じかだけ見る</text>
<line x1="1568" y1="204.0" x2="1608" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1616" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1616" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1642" cy="152" r="14" fill="#3b5bdb"/>
<text x="1642" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="1664" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">区分を 4 値で付ける</text>
<circle cx="1640" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(A) 入れ替えの全てに突合が在る</text>
<circle cx="1640" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(B) 突合の無い入れ替えが在る</text>
<circle cx="1640" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(C) 替わっていない・相手は登録に在る</text>
<circle cx="1640" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">(D) 出どころが 1 つだけ</text>
<line x1="1884" y1="204.0" x2="1924" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1932" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1932" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1958" cy="152" r="14" fill="#3b5bdb"/>
<text x="1958" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="1980" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">歩いた最後といまを並べる</text>
<circle cx="1956" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">最後の動きの後 = 歩いた最後の主</text>
<circle cx="1956" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">いまの由来の台帳の主と並べる</text>
<circle cx="1956" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">違えば一覧に載せる</text>
<circle cx="1956" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どちらが正しいかは決めない</text>
<line x1="2200" y1="204.0" x2="2240" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="2248" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="2248" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="2274" cy="152" r="14" fill="#3b5bdb"/>
<text x="2274" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
<text x="2296" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">一覧と検算</text>
<circle cx="2272" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">rule ごとの行と動きごとの行</text>
<circle cx="2272" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">4 値 + 別枠 = rule の件数</text>
<circle cx="2272" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">判定部分の sha256</text>
<circle cx="2272" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="2284" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">verify で 5 つ見る</text>
<line x1="324.0" y1="292" x2="324.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="217.375" y="310" width="213.25" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="324.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">列が無い / id が空か重複</text>
<line x1="640.0" y1="292" x2="640.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="545.725" y="310" width="188.54999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="640.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">出典が空 / 登録表に無い</text>
<line x1="956.0" y1="292" x2="956.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="861.725" y="310" width="188.54999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="956.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">順の番号が重複か整数でない</text>
<line x1="1272.0" y1="292" x2="1272.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1146.85" y="310" width="250.29999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1272.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">線がつながらない / 古い側の役が空</text>
<line x1="1588.0" y1="292" x2="1588.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1530.775" y="310" width="114.45" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1588.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">件数が読めない</text>
<line x1="2220.0" y1="292" x2="2220.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="2094.85" y="310" width="250.29999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="2220.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">件数の合計が合わない(verify)</text>
<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">別枠の 6 つの理由は rule ごとに付く(その rule だけ区分を付けず、ほかの rule は歩く)。動きに結び付かない突合は、止めずに別の一覧へ出す。2 経路の値の突合は cross_route、いまの断面の由来は backing_axis、入れ替える前の経路の状態は swap_ready、増減を歩く検算は roll_forward の仕事。</text>
</svg>