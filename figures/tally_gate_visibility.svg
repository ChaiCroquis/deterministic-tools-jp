<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">同じ壊れ方でも、どの軸で足すかで見える件数が変わる — 出なかった軸も表から消さない</text>
<text x="36" y="74" font-size="14" fill="#5b6272">出典 = 合成の明細(8 人 + 集計行 1 / 8 項目、架空)に壊れ方を 1 つずつ仕込んだ実走。打ち消し合う差は総計を通り、交点も 1 組に決まらない。収集範囲は合成した 1 枚だけ</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">人ごとの合計で見える</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">項目ごとの合計で見える</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">総計で見える</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">交点が特定できる</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">1 か所の値のずれ</text>
