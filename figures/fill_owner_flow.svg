<text x="1272.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">id の重複 / 出典が空 / 一覧 id</text>
<line x1="1904.0" y1="292" x2="1904.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1791.2" y="310" width="225.6" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1904.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">件数が合わない / 行順で変わる</text>
<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">理由コードは 12 個(表の側 4 + 問いごとの別枠 8)。表の側の 4 つはどれか 1 つでも起きると、どの問いも仕分けない(8 値は全て 0)。期限に日数を足すのは別の部品、効き始める日が先の行の扱いも別の部品、日付の種別の台帳も別の部品の仕事で、この図にその経路は無い。</text>
