<text x="388" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">空欄があれば止まる</text>
<circle cx="376" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="388" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">定義が 2 行以上なら止まる</text>
