<text x="1652" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">外し方の記号も写す</text>
<circle cx="1640" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">記号が登録外なら別枠へ</text>
