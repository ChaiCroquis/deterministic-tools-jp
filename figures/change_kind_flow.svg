<text x="640.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">別枠 4 つ</text>
<line x1="956.0" y1="292" x2="956.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="904.95" y="310" width="102.1" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="956.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">別枠 2 つ</text>
<line x1="1588.0" y1="292" x2="1588.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1493.725" y="310" width="188.54999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1588.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">当てずに (D) で止める</text>
<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">件数と指紋の 2 経路・増減の累計・出どころの入れ替え・再計算の範囲は別の部品で扱っていて、この部品は見本の old と new だけを読む</text>
