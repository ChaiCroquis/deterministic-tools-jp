<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">宣言 3 項目を 5 つの約束に割り、翌日の 1 枚での記載を並べる</text>
<text x="36" y="74" font-size="14" fill="#5b6272">行 = 約束 1 件(割り方は私の判断。道具は文を割らない)。完了率の行・正しい側の列・理由の列・合計の 1 値は置かない。記載なしは 2 ファイルを読んだ範囲の話で、作業そのものの有無を確かめた結果ではない。</text>
