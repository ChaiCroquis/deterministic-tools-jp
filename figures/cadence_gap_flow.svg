<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">3 枚のどれかが 1 行でも壊れていたら、どの問いも数えない(6 値は全て 0 で、理由コード 11 個のうち該当するものが返る)。次回改定の近さは受け取っても鮮度の列には入らず、別の一覧に出る。宣言された実行をその場で走らせるのは check census の道具で、この図にその経路は無い。</text>
