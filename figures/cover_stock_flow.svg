<text x="1032" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">端と穴を見る</text>
<circle cx="1008" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">収録開始と終了の前後</text>
