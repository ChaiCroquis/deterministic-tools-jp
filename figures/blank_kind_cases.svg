<rect width="1994" height="1412" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">線の内側に残っている空白 9 件 — 空白は 1 種類しか無いのに、意味は 9 通りある</text>
<text x="36" y="74" font-size="14" fill="#5b6272">出典はいずれも私の棚卸し記録(非公開)。収集範囲はその記録に書かれている範囲に限る(制度や repo を網羅して読んだわけではない)。値(料率・金額・上限の数)は出さない。残りの断りは本文に書いた。</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">どこに在る空白か</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">線の内側である根拠</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">原文に残っている理由と量</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">この道具での返し方</text>
<text x="172" y="197.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">値をまだ取っていない</text>
