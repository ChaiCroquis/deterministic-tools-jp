<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">行として並んでいる</text>
<circle cx="662" cy="195" r="2.5" fill="#5b6272"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どの軸で引くかまで書いてある</text>
