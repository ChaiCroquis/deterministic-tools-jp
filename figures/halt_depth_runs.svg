<svg xmlns="http://www.w3.org/2000/svg" width="2440" height="548" viewBox="0 0 2440 548" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="2440" height="548" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">failed と書かれた 2 回を、エラーの欄の中の印まで降りて並べる</text>
<text x="36" y="74" font-size="14" fill="#5b6272">上の層 = 状態の 1 語と段の名前は 2 回とも同じ字。下の層 = エラーの欄を行に割り、登録した印が在るか・何行目か・後ろの文字列を原文のまま置く</text>
<text x="1297.0" y="92" font-size="13" font-weight="normal" text-anchor="middle" fill="#5b6272">印と段の対応は人が登録したもの。MISMATCH の行数は表示された行の数。伏せた行が各 1 行在る。残る 9 回はエラーの欄が空。手元の 11 回だけで、網羅ではない</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">上の層(状態と段)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">行数の印 / 重なりの印</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">不一致の印 / 突き合わせの印</text>
<text x="1743.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">止まった印</text>
<text x="2189.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">区分</text>
<text transform="translate(36,304.0) rotate(-90)" font-size="13" text-anchor="middle" fill="#5b6272">実行の履歴の行(回の台帳の順)</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">履歴 3 行目の回</text>
