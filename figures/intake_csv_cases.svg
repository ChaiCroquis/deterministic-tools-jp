<svg xmlns="http://www.w3.org/2000/svg" width="1102" height="1628" viewBox="0 0 1102 1628" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1102" height="1628" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">入力の種類 × 書き出し方 — どこまで機械が書き、どこから人に返すか</text>
<text x="36" y="74" font-size="14" fill="#5b6272">合成データで実測(tests/test_intake_csv.py)。素朴な書き出し = 検査も読み戻しもせず、カンマはクォートで逃がし、cp932 に無い字は置換文字にする</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">素朴な書き出し(書いて終わり)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">この部品(検査 → 書く → 読み戻して突合)</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">先頭ゼロのコード</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">表計算を通すと落ちる</text>
<circle cx="216" cy="195" r="2.5" fill="#c2410c"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">0042 が 42 になる</text>
<circle cx="216" cy="219" r="2.5" fill="#c2410c"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">書き出し側では気づけない</text>
<rect x="636" y="132" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">そのまま書ける</text>
<circle cx="662" cy="195" r="2.5" fill="#3b5bdb"/>
<text x="674" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">列仕様の桁までゼロ埋め</text>
<circle cx="662" cy="219" r="2.5" fill="#3b5bdb"/>
<text x="674" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">読み戻しでも 000042</text>
<text x="172" y="399.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">半角カナ・髙・﨑・①</text>
<rect x="190" y="312" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">寄せてしまうことがある</text>
<circle cx="216" cy="375" r="2.5" fill="#c2410c"/>
<text x="228" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">NFKC で全角に寄せる実装が多い</text>
<circle cx="216" cy="399" r="2.5" fill="#c2410c"/>
<text x="228" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">寄せた時点で別の値になる</text>
<rect x="636" y="312" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="348" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">そのまま書ける</text>
<circle cx="662" cy="375" r="2.5" fill="#3b5bdb"/>
<text x="674" y="380" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">cp932 にある字なので正規化しない</text>
<circle cx="662" cy="399" r="2.5" fill="#3b5bdb"/>
<text x="674" y="404" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">髙 U+9AD9 も ① U+2460 も書ける</text>
<text x="172" y="579.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">値の中のカンマ</text>
<rect x="190" y="492" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">列がずれる</text>
<circle cx="216" cy="555" r="2.5" fill="#c2410c"/>
<text x="228" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">クォートで逃がすと取込側が読めない</text>
<circle cx="216" cy="579" r="2.5" fill="#c2410c"/>
<text x="228" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">逃がさないと 1 列多い行になる</text>
<circle cx="216" cy="603" r="2.5" fill="#c2410c"/>
<text x="228" y="608" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">後ろの列が全部 1 つずれる</text>
<rect x="636" y="492" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="528" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">判断待ちに落ちる</text>
<circle cx="662" cy="555" r="2.5" fill="#5b6272"/>
<text x="674" y="560" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由コード 区切り文字が値の中にある</text>
<circle cx="662" cy="579" r="2.5" fill="#5b6272"/>
<text x="674" y="584" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出力ファイルは作らない</text>
<text x="172" y="759.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">値の中の改行</text>
<rect x="190" y="672" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">行数が変わる</text>
<circle cx="216" cy="735" r="2.5" fill="#c2410c"/>
<text x="228" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1 レコードが 2 行になる</text>
<circle cx="216" cy="759" r="2.5" fill="#c2410c"/>
<text x="228" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">そこから後ろの記録が全部ずれる</text>
<circle cx="216" cy="783" r="2.5" fill="#c2410c"/>
<text x="228" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">合成 1,000 行では 950 行が巻き込まれた</text>
<rect x="636" y="672" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="708" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">判断待ちに落ちる</text>
<circle cx="662" cy="735" r="2.5" fill="#5b6272"/>
<text x="674" y="740" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由コード 改行が値の中にある</text>
<circle cx="662" cy="759" r="2.5" fill="#5b6272"/>
<text x="674" y="764" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">1 行 1 レコードの形を崩さない</text>
<text x="172" y="939.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">cp932 に無い字</text>
<rect x="190" y="852" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">置換文字に化ける</text>
<circle cx="216" cy="915" r="2.5" fill="#c2410c"/>
<text x="228" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">errors=replace で ? になる</text>
<circle cx="216" cy="939" r="2.5" fill="#c2410c"/>
<text x="228" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">例外にならないので書けたように見える</text>
<rect x="636" y="852" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="888" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">判断待ちに落ちる</text>
<circle cx="662" cy="915" r="2.5" fill="#5b6272"/>
<text x="674" y="920" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由コード cp932 に無い文字</text>
<circle cx="662" cy="939" r="2.5" fill="#5b6272"/>
<text x="674" y="944" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">どの字か(符号位置)を返す</text>
<text x="172" y="1119.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">波ダッシュ U+301C</text>
<rect x="190" y="1032" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="1068" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">黙って別の字になる</text>
<circle cx="216" cy="1095" r="2.5" fill="#c2410c"/>
<text x="228" y="1100" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">cp932 には書けるので例外が出ない</text>
<circle cx="216" cy="1119" r="2.5" fill="#c2410c"/>
<text x="228" y="1124" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">読み戻すと U+FF5E の全角チルダ</text>
<rect x="636" y="1032" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="1068" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">判断待ちに落ちる</text>
<circle cx="662" cy="1095" r="2.5" fill="#5b6272"/>
<text x="674" y="1100" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由コード 書いて読むと別の文字になる</text>
<circle cx="662" cy="1119" r="2.5" fill="#5b6272"/>
<text x="674" y="1124" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">書いて読む往復で機械が見つける</text>
<text x="172" y="1299.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">桁あふれ・空欄</text>
<rect x="190" y="1212" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="1248" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">切り詰める・空欄で埋める</text>
<circle cx="216" cy="1275" r="2.5" fill="#c2410c"/>
<text x="228" y="1280" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">桁に合わせて切ると別の値になる</text>
<circle cx="216" cy="1299" r="2.5" fill="#c2410c"/>
<text x="228" y="1304" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">空欄は取込側で別の意味になる</text>
<rect x="636" y="1212" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="1248" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">判断待ちに落ちる</text>
<circle cx="662" cy="1275" r="2.5" fill="#5b6272"/>
<text x="674" y="1280" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">理由コード 桁あふれ / 必要な値が空</text>
<circle cx="662" cy="1299" r="2.5" fill="#5b6272"/>
<text x="674" y="1304" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">切り詰めも埋めもしない</text>
<text x="172" y="1479.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">仕様に無い列</text>
<rect x="190" y="1392" width="430" height="164" rx="14" fill="#fff1e8" stroke="#f5c9ae" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="1428" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">そのまま書いてしまう</text>
<circle cx="216" cy="1455" r="2.5" fill="#c2410c"/>
<text x="228" y="1460" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">取込側が知らない列が増える</text>
<circle cx="216" cy="1479" r="2.5" fill="#c2410c"/>
<text x="228" y="1484" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">列の順も揃わない</text>
<rect x="636" y="1392" width="430" height="164" rx="14" fill="#e7ecfb" stroke="#c4d0f6" stroke-width="1" filter="url(#shadow)"/>
<text x="658" y="1428" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">書かないで列名を返す</text>
<circle cx="662" cy="1455" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1460" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出力の列は列仕様の表が正本</text>
<circle cx="662" cy="1479" r="2.5" fill="#3b5bdb"/>
<text x="674" y="1484" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">落とした列名は報告する</text>
<rect x="190" y="1582" width="18" height="14" rx="4" fill="#e7ecfb" stroke="#c4d0f6"/>
<text x="216" y="1594" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">列仕様どおり書ける(機械が決める)</text>
<rect x="482" y="1582" width="18" height="14" rx="4" fill="#fff1e8" stroke="#f5c9ae"/>
<text x="508" y="1594" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">黙って壊れる(取込の後で分かる)</text>
<rect x="760" y="1582" width="18" height="14" rx="4" fill="#eef0f5" stroke="#d9dce6"/>
<text x="786" y="1594" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">判断待ちとして人に返す</text>
</svg>