<text x="1272.0" y="353" font-size="13" text-anchor="middle" fill="#c2410c">件数が合わない / 行順で変わる</text>
<text x="36" y="420" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">走らせたかの別は検査の棚卸しの回、引ける行と参照される行の別は使われない行の回、ファイルの書き手と作り直す元は作り直しの軸の回、来年の置き場の決まり方は置き場の種類の回で扱った。この図は取ってきた本数と使われた記載の対応だけを扱う。</text>
