<text x="1020" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">補助の語数え(別の列)</text>
<line x1="1252" y1="216.0" x2="1292" y2="216.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1300" y="118" width="260" height="196" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
