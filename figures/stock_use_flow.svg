<text x="1336" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">内訳の合計 = 置き場の種類の数</text>
<circle cx="1324" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">判定部分の sha256</text>
