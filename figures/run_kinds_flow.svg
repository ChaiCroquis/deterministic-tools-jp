<svg xmlns="http://www.w3.org/2000/svg" width="2228" height="426" viewBox="0 0 2228 426" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="2228" height="426" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">実行の記録を回ごとに仕分けるまでの流れ</text>
<text x="36" y="74" font-size="14" fill="#5b6272">橙のピルが関所。成功率や割合を返す経路・error の文字列を読む経路・事後の申告を試験として数える経路・現在時刻を読む経路・鮮度や次回を出す経路・差分の中身を開く経路・再実行する経路・取りに行く経路・良し悪しや順位を出す経路・入力を直す経路は、この図に無い(引数が無い)。</text>
<rect x="36" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="36" y="118" width="260" height="6" rx="3" fill="#e7ecfb"/>
<circle cx="62" cy="152" r="14" fill="#3b5bdb"/>
<text x="62" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="84" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">3 枚を読む</text>
<circle cx="60" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="72" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実行の台帳は 9 列</text>
<circle cx="60" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="72" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">意図の宣言表は 4 列</text>
<circle cx="60" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="72" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">語の登録表は 4 列</text>
<circle cx="60" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="72" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">時刻の欄は持たない</text>
<line x1="304" y1="204.0" x2="344" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="352" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="352" y="118" width="260" height="6" rx="3" fill="#d6def9"/>
<circle cx="378" cy="152" r="14" fill="#3b5bdb"/>
<text x="378" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="400" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">出典と形を見る</text>
<circle cx="376" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="388" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">行ごとに出典が在るか</text>
<circle cx="376" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="388" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">実行 id が重複しないか</text>
<circle cx="376" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="388" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">並び順が 1 から連続か</text>
<circle cx="376" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="388" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分の件数が整数か</text>
<line x1="620" y1="204.0" x2="660" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="668" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="668" y="118" width="260" height="6" rx="3" fill="#c4d0f6"/>
<circle cx="694" cy="152" r="14" fill="#3b5bdb"/>
<text x="694" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="716" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">語を登録表に当てる</text>
<circle cx="692" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="704" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">status の語が在るか</text>
<circle cx="692" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="704" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">無い語は別枠へ</text>
<circle cx="692" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="704" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">意図コードが在るか</text>
<circle cx="692" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="704" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">語の形から当てない</text>
<line x1="936" y1="204.0" x2="976" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="984" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="984" y="118" width="260" height="6" rx="3" fill="#b0c1f2"/>
<circle cx="1010" cy="152" r="14" fill="#3b5bdb"/>
<text x="1010" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="1032" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">据え置きで先に分ける</text>
<circle cx="1008" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">据え置きを伴う語か</text>
<circle cx="1008" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分が書かれていたら止まる</text>
<circle cx="1008" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">指紋が在れば別枠へ</text>
<circle cx="1008" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1020" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分も指紋も見に行かない</text>
<line x1="1252" y1="204.0" x2="1292" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1300" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1300" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1326" cy="152" r="14" fill="#3b5bdb"/>
<text x="1326" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="1348" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">宣言の前後を見る</text>
<circle cx="1324" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">意味が 試験 か</text>
<circle cx="1324" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">宣言が実行より前か</text>
<circle cx="1324" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">前だけが ① へ</text>
<circle cx="1324" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1336" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">後・試験でない・無しは ②</text>
<line x1="1568" y1="204.0" x2="1608" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1616" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1616" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1642" cy="152" r="14" fill="#3b5bdb"/>
<text x="1642" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="1664" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">直前の指紋と比べる</text>
<circle cx="1640" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">初回の印は ③ へ</text>
<circle cx="1640" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">遡って空でない指紋を探す</text>
<circle cx="1640" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">差分 0 と動きを突き合わす</text>
<circle cx="1640" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1652" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">噛み合わなければ ⑥</text>
<line x1="1884" y1="204.0" x2="1924" y2="204.0" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1932" y="118" width="260" height="172" rx="14" fill="#ffffff" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<rect x="1932" y="118" width="260" height="6" rx="3" fill="#9cb1ee"/>
<circle cx="1958" cy="152" r="14" fill="#3b5bdb"/>
<text x="1958" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="1980" y="158" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">数えて検算する</text>
<circle cx="1956" cy="189" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">6 値 + 別枠と 4 つの分母</text>
<circle cx="1956" cy="213" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="218" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">戻りの印つき一覧</text>
<circle cx="1956" cy="237" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="242" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">3 通りの合計の検算</text>
<circle cx="1956" cy="261" r="2.5" fill="#3b5bdb"/>
<text x="1968" y="266" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">sha256 → verify 5 つ</text>
<line x1="324.0" y1="292" x2="324.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="242.075" y="310" width="163.85" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="324.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">列が無い / 行が無い</text>
<line x1="640.0" y1="292" x2="640.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="490.15" y="310" width="299.7" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="640.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">出典が空 / id の重複 / 並び順の飛び</text>
<line x1="956.0" y1="292" x2="956.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="867.9" y="310" width="176.2" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="956.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">意図コードが登録表に無い</text>
<line x1="1272.0" y1="292" x2="1272.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1159.2" y="310" width="225.6" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1272.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">据え置きの回に差分が書かれている</text>
<line x1="1588.0" y1="292" x2="1588.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1481.375" y="310" width="213.25" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1588.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">同じ回に 2 通りの意図コード</text>
<line x1="1904.0" y1="292" x2="1904.0" y2="308" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/>
<rect x="1778.85" y="310" width="250.29999999999998" height="28" rx="14" fill="#fff1e8" stroke="#c2410c" stroke-width="1"/>
<text x="1904.0" y="329" font-size="13" text-anchor="middle" fill="#c2410c">初回の印の位置 / 比べる相手が無い</text>
<text x="36" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6272">3 枚のどれかが 1 行でも壊れていたら、どの回も数えない(6 値は全て 0 で、理由コード 12 個のうち該当するものが返る)。意図の宣言表が台帳に無い実行 id を指す行は、止めずに別の一覧へ出す。台帳を書くのは update_ledger、宣言された検証を走らせるのは check_census、出し直す範囲は recalc_scope、鮮度は cadence_gap の仕事で、この図にその経路は無い。</text>
</svg>