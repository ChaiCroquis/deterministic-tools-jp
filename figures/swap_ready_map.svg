<circle cx="1108" cy="195" r="2.5" fill="#c2410c"/>
<text x="1120" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">跡の欄 = 版の欄、0 件 / 11 行</text>
