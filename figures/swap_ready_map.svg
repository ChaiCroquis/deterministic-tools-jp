<svg xmlns="http://www.w3.org/2000/svg" width="1548" height="1268" viewBox="0 0 1548 1268" font-family="'BIZ UDPGothic', 'Yu Gothic UI', 'Meiryo UI', sans-serif">
<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="0" dy="2" result="off"/><feFlood flood-color="#1b1f2a" flood-opacity="0.10" result="col"/><feComposite in="col" in2="off" operator="in" result="sh"/><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="#5b6272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1548" height="1268" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">「入れ替えてよい」と書いた経路を、許可の根拠と検査の所属と跡の件数で並べた表</text>
<text x="36" y="74" font-size="14" fill="#5b6272">行 = 入れ替えの経路、列 = ① 許可の根拠 / ② 受け入れ検査の所属 / ③ 跡の欄と件数と 4 値。入れ替えるべきかの列・正しい側の列・順位の列は置かない。</text>
<text x="851.0" y="92" font-size="13" font-weight="normal" text-anchor="middle" fill="#5b6272">入れ替えられると言える根拠は、どの層に何と書かれているか</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">① 許可の根拠(出典つき)</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">② 受け入れ検査の所属(出典つき)</text>
<text x="1297.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">③ 跡の欄と件数 → 4 値</text>
<text transform="translate(36,664.0) rotate(-90)" font-size="13" text-anchor="middle" fill="#5b6272">入れ替えの経路(対象の種別 / 入れ替える側の束)</text>
<text x="172" y="219.0" font-size="15" font-weight="bold" text-anchor="end" fill="#1b1f2a">版 / 借り物の束</text>
<rect x="190" y="132" width="430" height="164" rx="14" fill="#eef0f5" stroke="#d9dce6" stroke-width="1" filter="url(#shadow)"/>
<text x="212" y="168" font-size="17" font-weight="bold" text-anchor="start" fill="#1b1f2a">許す(入れ替える経路が在る)</text>
<circle cx="216" cy="195" r="2.5" fill="#5b6272"/>
<text x="228" y="200" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">「上流 pull → 変換 → 検証 → 差分」</text>
<circle cx="216" cy="219" r="2.5" fill="#5b6272"/>
<text x="228" y="224" font-size="14" font-weight="normal" text-anchor="start" fill="#1b1f2a">出典 = 私の記録の README 33 行目</text>
