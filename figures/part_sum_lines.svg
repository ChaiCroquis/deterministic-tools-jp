<rect width="1994" height="1268" fill="#f5f6fa"/>
<text x="36" y="48" font-size="24" font-weight="bold" fill="#1b1f2a">総数 1,681 行の下の内訳 4 行を、読みの種類で分けて足した一覧</text>
<text x="36" y="74" font-size="14" fill="#5b6272">数は人(私)が括弧から写したもので、道具が文書から拾ったのではない。「各 4」を 16 と読むのは人の読み。差を数の付いていない項目の行数とは書けない(文書にそう書かれていない)。表そのものの行を数えた結果ではない。手元の 1 文書だけで網羅ではない。割合の列・良し悪しの列・差を割り振った列は置かない。</text>
<text x="405.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">そのまま写した項目</text>
<text x="851.0" y="118" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b1f2a">掛けて読んだ項目</text>
