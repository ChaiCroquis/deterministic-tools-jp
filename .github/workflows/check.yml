name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 投稿係のオフライン検証(API・Sentinel 不要)
        run: python -X utf8 publish/test_blogger_publish.py
      - name: 記事の道具のテスト(tools/*/tests)
        run: |
          # 道具ごとに専用の venv を作り、その道具の requirements.txt(外部依存を == で固定)と、テストを回す側の
          # pytest / hypothesis だけを入れて回す。hypothesis は性質テスト(関所 10)用。derandomize で同じ入力列を
          # 再現するので版を固定する(手元で通した版。上げる時は手元で通してからここを変える)。
          # 他の道具の依存で偶然通ることがなく、宣言漏れはここで落ちる。別プロセスなので、各道具が持つ
          # 同名の fixtures/make_fixtures.py も取り違えない(手元の series_check.py も道具単位)
          fail=0; found=0
          for t in tools/*/tests; do
            [ -d "$t" ] || continue
            found=1
            d=$(dirname "$t")
            echo "== $d"
            if [ ! -f "$d/requirements.txt" ]; then echo "requirements.txt が無い: $d"; fail=1; continue; fi
            venv="${RUNNER_TEMP:-/tmp}/venv-$(basename "$d")"
            python -m venv "$venv"
            py="$venv/bin/python"; [ -x "$py" ] || py="$venv/Scripts/python.exe"   # 後者は Windows で手元再現する時
            "$py" -m pip install -q --disable-pip-version-check pytest hypothesis==6.152.8 -r "$d/requirements.txt" || { fail=1; continue; }
            "$py" -m pytest "$t" -q || fail=1
          done
          [ "$found" = 1 ] || echo "tools/ なし"
          exit $fail
      - name: 公開してはいけないもの(秘密・ローカルパス・メール)の混入検査
        run: python -X utf8 publish/scan_public.py .
      - name: 記事が参照する図が figures/ に実在するか
        run: |
          python - <<'EOF'
          import re, sys
          from pathlib import Path
          missing = []
          for md in Path("articles").glob("*.md"):
              if md.name.lower() == "readme.md":   # 書式説明の例示はスキップ
                  continue
              for m in re.finditer(r"!\[[^\]]*\]\((?!https?://)([^)\s]+)\)", md.read_text(encoding="utf-8")):
                  if not Path(m.group(1)).exists():
                      missing.append(f"{md}: {m.group(1)}")
          print("\n".join(missing) or "OK: all figure paths exist")
          sys.exit(1 if missing else 0)
          EOF
