name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 投稿係のオフライン検証(API・Sentinel 不要)
        run: python -X utf8 publish/test_blogger_publish.py
      - name: 記事の道具のテスト(tools/*/tests)
        run: |
          # openpyxl は excel_report の依存。記事・README で確かめた版に固定する(版で xlsx の中身が変わるテストがある)
          pip install -q pytest openpyxl==3.1.5
          # 道具ごとに別プロセスで回す。各道具が同名の fixtures/make_fixtures.py を持つので、
          # 1 プロセスで tools/ を回すと先に読んだ make_fixtures を他の道具が掴む(手元の series_check.py も道具単位)
          fail=0; found=0
          for t in tools/*/tests; do
            [ -d "$t" ] || continue
            found=1
            echo "== $t"
            python -m pytest "$t" -q || fail=1
          done
          [ "$found" = 1 ] || echo "tools/ なし"
          exit $fail
      - name: 公開してはいけないもの(秘密・ローカルパス・メール)の混入検査
        run: python -X utf8 publish/scan_public.py .
      - name: 記事が参照する図が figures/ に実在するか
        run: |
          python - <<'EOF'
          import re, sys
          from pathlib import Path
          missing = []
          for md in Path("articles").glob("*.md"):
              if md.name.lower() == "readme.md":   # 書式説明の例示はスキップ
                  continue
              for m in re.finditer(r"!\[[^\]]*\]\((?!https?://)([^)\s]+)\)", md.read_text(encoding="utf-8")):
                  if not Path(m.group(1)).exists():
                      missing.append(f"{md}: {m.group(1)}")
          print("\n".join(missing) or "OK: all figure paths exist")
          sys.exit(1 if missing else 0)
          EOF
